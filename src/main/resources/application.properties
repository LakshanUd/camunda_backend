spring.application.name=camunda-backend
server.port=8082
camunda.api.url=http://localhost:8081/camundaWorkflow/engine-rest

camunda.bpm.database.schema-update=true
camunda.bpm.database.type=mysql

# ==========================================
# CUSTOM MYSQL DATABASE CONNECTION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/camunda_custom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=Admin@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HIKARICP CONNECTION POOLING (High Performance)
# ==========================================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA & HIBERNATE CONFIGURATION
# ==========================================
# 'update' automatically generates and updates MySQL tables based on your Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect